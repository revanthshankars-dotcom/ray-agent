services:
  jarvis-brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    restart: unless-stopped
    environment:
      JARVIS_BRAIN_API_KEY: ${JARVIS_BRAIN_API_KEY:?Set JARVIS_BRAIN_API_KEY in .env}
      JARVIS_BRAIN_DATA_DIR: /data
      JARVIS_BRAIN_DB_PATH: /data/brain.sqlite3
      JARVIS_BRAIN_EMBEDDING_MODEL: ${JARVIS_BRAIN_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      JARVIS_BRAIN_BACKUP_INTERVAL_HOURS: ${JARVIS_BRAIN_BACKUP_INTERVAL_HOURS:-24}
      JARVIS_BRAIN_BACKUP_RETENTION_DAYS: ${JARVIS_BRAIN_BACKUP_RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./storage/jarvis_brain:/data
