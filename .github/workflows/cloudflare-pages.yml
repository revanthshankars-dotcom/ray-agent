# Deploy RAY's web app + Pages Functions to Cloudflare Pages on every push to main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare token with "Cloudflare Pages: Edit").
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 4f777e7938510fe7d9a0d547628226a7
      PAGES_PROJECT: ray-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --include=dev

      - name: Build
        run: npx vite build
        env:
          RAY_BUILD_ID: ${{ github.sha }}

      - name: Check Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Deploy (static app + functions/ proxy)
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
